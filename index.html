<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>
<body>
    <div class="hero-card">
    <div class="head-line">Stock Pedia</div>

    <div class="stock-card">
        <div class="stock-data">
            <p id="stock-name" class="stock-data">Name :</p>
            <p id="stk-name"></p>
        </div>
        <div class="stock-data">
            <p id="stock-stymbol" class="stock-data">Symbol :</p>
            <p id="stk-symbol"></p>
        </div>
        
        <div class="stock-data">
            <p id="stock-price">Price :</p>
            <p id="stk-price"></p>
            <p id="price-icon"></p>
        </div>

        <div class="stock-data">
            <p id="time" class="stock-data">Time :</p>
            <p id="stk-time"></p>
        </div>

        <div class="stock-buy"> 
            <button class="st-buy" id="buy">Buy Now</button>
            <button class="st-buy" id="details">Stock Details</button>
        </div>
    </div>
    </div>
    <script type="module" src="index.js"></script>
</body>
</html>
